    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">

</head>
<body>

    <header class="main-header">
        <div class="container header-content">
            <div class="logo">ARIZONA<span class="logo-accent">MEDIA</span></div>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="../index.html" class="nav-link">Главная</a></li>
                    <li><a href="media.html" class="nav-link">Медиа</a></li>
                    <li><a href="academy.html" class="nav-link active">Академия</a></li>
                    <li><a href="about.html" class="nav-link">О нас</a></li>
                </ul>
            </nav>
            <div class="header-buttons">
                <a href="#" class="btn btn-small btn-primary">Подать заявку</a>
                <a href="#start" class="btn btn-small btn-outline">Личный кабинет</a>
            </div>
        </div>
    </header>

    <main>
        <section class="steps-section" style="min-height: 100vh;">
            <div class="container">
                <h2 style="text-align: center; margin-bottom: 50px;">Академия Проекта</h2>
                <div class="media-tabs">
                    <button class="tab-btn active" onclick="openTab(event, 'tiktok')">TikTok Academy</button>
                    <button class="tab-btn" onclick="openTab(event, 'youtube')">YouTube Academy</button>
                </div>

                <div id="tiktok" class="media-section-content active">
                    <div class="steps-grid" id="tiktok-grid"></div>
                </div>

                <div id="youtube" class="media-section-content">
                    <div class="steps-grid" id="youtube-grid"></div>
                </div>

            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p class="copyright">&copy;2026 Все права защищены.</p>
        </div>
    </footer>

    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("media-section-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active");
            }
            tablinks = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            setTimeout(() => { document.getElementById(tabName).classList.add("active"); }, 10);
            evt.currentTarget.className += " active";
        }

        /* --- БАЗА ДАННЫХ АКАДЕМИИ --- */
        
        // 1. TIKTOK ACADEMY (15 мест)
        const tiktokData = [
            { name: "xitoshi.exe", img: "xitoshi.jpg", link: "https://www.tiktok.com/@xitoshi.exe?is_from_webapp=1&sender_device=pc", tg_link: "https://t.me/xitoshi_arz" },
            { name: "banz_arizona", img: "banzik.jpg", link: "https://www.tiktok.com/@banz_arizona?is_from_webapp=1&sender_device=pc", tg_link: "https://t.me/banzik_delaet" },
            { name: "dankut.exe", img: "dankutik.jpg", link: "https://www.tiktok.com/@dankut.exe?is_from_webapp=1&sender_device=pc", tg_link: "https://t.me/dankutik" },
            { name: "camel.lua", img: "camelskyyy.jpeg", link: "https://www.tiktok.com/@camel.lua?is_from_webapp=1&sender_device=pc", tg_link: "https://t.me/camelskyyy" },
            { name: "akira.lua", img: "akira.jpg", link: "https://www.tiktok.com/@akira.lua25?is_from_webapp=1&sender_device=pc", tg_link: "https://t.me/akira_lua" },
            { name: "grafpivas", img: "grafpivas.jpg", link: "https://www.tiktok.com/@grafpivas?is_from_webapp=1&sender_device=pc", tg_link: "https://t.me/grafpivasxd" },
            { name: "avto_ritetov", img: "avtoritetovcho.jpg", link: "https://www.tiktok.com/@avto_ritetov?is_from_webapp=1&sender_device=pc", tg_link: "https://t.me/avtoritetovcho" },
            { name: "xeon_kent", img: "xeon.jpeg", link: "https://www.tiktok.com/@xeon_kent?is_from_webapp=1&sender_device=pc", tg_link: "https://t.me/xeonkent" },
            { name: "lamborghini", img: "im.mercury_.jpeg", link: "https://www.tiktok.com/@im.mercury_?is_from_webapp=1&sender_device=pc", tg_link: "404" },
            { name: "ingvar_tradefum", img: "ingvar.jpeg", link: "https://www.tiktok.com/@ingvar_tradefum?is_from_webapp=1&sender_device=pc", tg_link: "404" },
            { name: "blazer", img: "blazer.jpeg", link: "https://www.tiktok.com/@blazer___28?is_from_webapp=1&sender_device=pc", tg_link: "404" },
            { name: "hirakawa.rey", img: "hirakawa.rey.jpeg", link: "https://www.tiktok.com/@hirakawa.rey?is_from_webapp=1&sender_device=pc", tg_link: "404" },
            { name: "rayan_exe", img: "twiz.jpeg", link: "https://www.tiktok.com/@rayan_exe_?is_from_webapp=1&sender_device=pc", tg_link: "404" },
            { name: "ssamparella", img: "ssamparella.jpeg", link: "https://www.tiktok.com/@ssamparella?is_from_webapp=1&sender_device=pc", tg_link: "404" },
            { name: "karaseviy", img: "karaseviy.jpeg", link: "https://www.tiktok.com/@nocap_qwx?is_from_webapp=1&sender_device=pc", tg_link: "https://t.me/akvrkaraseviy" },
            { name: "hodges.lua", img: "hodgesluaa.jpg", link: "https://www.tiktok.com/@hodges.lua?is_from_webapp=1&sender_device=pc", tg_link: "https://t.me/hodgesluaa" },
            // ... добавляй имена здесь
        ];

        // 2. YOUTUBE ACADEMY (10 мест)
        const youtubeData = [
            { name: "Student_YT", img: "youtube_acad_1.jpg", link: "#", tg_link: "#" },
            { name: "Vlogger_Start", img: "youtube_acad_2.jpg", link: "#", tg_link: "#" },
        ];


        // --- СИСТЕМНАЯ ЧАСТЬ ---
        function createCardHTML(platform, index, dataList, isHidden = false) {
            const iconTikTok = 'https://cdn.simpleicons.org/tiktok/white';
            const iconYouTube = 'https://cdn.simpleicons.org/youtube/white';
            const iconTelegram = 'https://cdn.simpleicons.org/telegram/white';
            
            let platformIcon = '', platformClass = '';
            
            if (platform === 'TikTok') { 
                platformClass = 'tiktok-btn'; 
                platformIcon = iconTikTok; 
            } else if (platform === 'YouTube') { 
                platformClass = 'youtube-btn'; 
                platformIcon = iconYouTube; 
            }

            const person = dataList[index - 1];
            let finalName = person ? person.name : `Студент #${index}`;
            // Для Академии используем другой набор роботов (set2 - монстрики), чтобы отличались от Медиа
            let finalImg = person ? `../images/${person.img}` : `https://robohash.org/Academy_${platform}_${index}.png?size=200x200&set=set2`;
            let finalLink = person ? person.link : "#";
            let finalTgLink = person ? person.tg_link : "#";
            let backupImg = `https://robohash.org/Academy_${platform}_${index}.png?size=200x200&set=set2`;

            let hiddenClass = isHidden ? 'hidden-item' : '';

            return `
                <div class="media-card ${hiddenClass}">
                    <div class="media-avatar">
                        <img src="${finalImg}" onerror="this.onerror=null;this.src='${backupImg}';" alt="${finalName}">
                    </div>
                    <h3>${finalName}</h3>
                    <div class="media-links">
                        <a href="${finalLink}" target="_blank" class="social-btn ${platformClass}" title="Канал">
                            <img src="${platformIcon}"> 
                        </a>
                        <a href="${finalTgLink}" target="_blank" class="social-btn telegram-btn" title="Telegram">
                            <img src="${iconTelegram}">
                        </a>
                    </div>
                </div>
            `;
        }

        function fillGrid(gridId, platformName, count, dataList) {
            const grid = document.getElementById(gridId);
            let htmlContent = '';

            // Если количество <= 11, выводим всех сразу без кнопки
            if (count <= 11) {
                for (let i = 1; i <= count; i++) {
                    htmlContent += createCardHTML(platformName, i, dataList);
                }
            } else {
                // Если больше 11, делаем кнопку "ЕЩЁ"
                for (let i = 1; i <= 11; i++) {
                    htmlContent += createCardHTML(platformName, i, dataList);
                }
                htmlContent += `
                    <div class="media-card show-more-card" onclick="revealHidden(this, '${gridId}')">
                        <div class="show-more-text">ЕЩЁ +</div>
                    </div>
                `;
                for (let i = 12; i <= count; i++) {
                    htmlContent += createCardHTML(platformName, i, dataList, true);
                }
            }
            grid.innerHTML = htmlContent;
        }

        function revealHidden(btn, gridId) {
            btn.remove();
            const grid = document.getElementById(gridId);
            const hiddenItems = grid.querySelectorAll('.hidden-item');
            
            hiddenItems.forEach((item, index) => {
                item.classList.remove('hidden-item');
                item.classList.add('reveal-item');
                item.style.animationDelay = `${index * 0.08}s`; 
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Настройка количества мест:
            fillGrid('tiktok-grid', 'TikTok', 16, tiktokData);   // 15 человек
            fillGrid('youtube-grid', 'YouTube', 16, youtubeData); // 10 человек
        });
    </script>
</body>
</html>
